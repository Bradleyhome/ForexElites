<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | ForexElites</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui;background:#0a0a0f;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:30px;width:100%;max-width:400px}
  .logo{font-weight:800;font-size:20px;text-align:center;margin-bottom:20px;letter-spacing:.5px}
  .logo span{color:#22c55e}
  .form-group{margin-bottom:15px}
  label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px;font-weight:600}
  input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0a0a0f;color:#fff;font-size:14px;outline:none;transition:0.2s}
  input:focus{border-color:#22c55e}
  .btn{width:100%;background:#22c55e;color:#000;border:0;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;margin-top:10px;transition:0.2s}
  .btn:hover{background:#1ea34d}
  .btn:disabled{opacity:0.7;cursor:not-allowed}
  .error{background:#451a1a;border:1px solid #ef4444;color:#ef4444;padding:10px;border-radius:8px;font-size:12px;margin-bottom:15px;display:none;text-align:center}
  .footer{text-align:center;margin-top:20px;font-size:12px;color:#64748b}
  .footer a{color:#22c55e;text-decoration:none}
</style>
</head>
<body>

<div class="card">
  <div class="logo">FOREXELITES <span>LOGIN</span></div>
  
  <div id="errorBox" class="error"></div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@gmail.com" autocomplete="email">
  </div>
  
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button id="loginBtn" class="btn" onclick="login()">Secure Login</button>
  
  <div class="footer">
    Don't have an account? <a href="./">Get Access</a>
  </div>
</div>

<script>
// YOUR NEW COMPANY ACCOUNT URL
const API_URL = "https://script.google.com/macros/s/AKfycbxonwmI2i9gekW_0UOY1BRzjnS2-FXklAIwnCLYhQ4oObsUZJlAdut4b1pSvf45dFtt/exec";

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  const errorBox = document.getElementById('errorBox');

  if(!email || !password) {
    showError('Please enter both email and password.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Authenticating...';
  errorBox.style.display = 'none';

  try {
    // Note: We DO NOT use 'no-cors' here because we need to read the JSON response
    const response = await fetch(`${API_URL}?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&action=login`);
    const data = await response.json();

    if (data.success) {
      // Save user session to browser localStorage
      localStorage.setItem('forexelites_user', JSON.stringify({
        email: data.email,
        role: data.role,
        ref: data.ref
      }));
      
      // Redirect to dashboard
      window.location.href = 'dashboard.html';
    } else {
      showError(data.error || 'Invalid credentials. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Secure Login';
    }
  } catch (err) {
    showError('Network error. Check your connection.');
    btn.disabled = false;
    btn.textContent = 'Secure Login';
  }
}

function showError(msg) {
  const errorBox = document.getElementById('errorBox');
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}
</script>

</body>
</html>
