
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirming Email - ForexElites</title>
<style>
body{font-family:Arial;background:#020617;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:#0f172a;padding:30px;border-radius:16px;max-width:500px;text-align:center;width:100%}
.loader{border:4px solid #1e293b;border-top:4px solid #22c55e;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="loader"></div>
  <h3>Confirming your email...</h3>
  <p id="msg">Please wait, verifying token...</p>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyOeJarLWLpK0Xey1nzkH1OMbqdX3DrchinA54m8WeWESQ7VHf9wQyr0p2WCMmOPi2O/exec";
(function(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const msgEl = document.getElementById('msg');
  if (!token) {
    msgEl.innerHTML = "No token found. <a href='./' style='color:#22c55e;'>Go back to home</a>";
    return;
  }
  // Call API via JSONP style redirect - API will return HTML confirmation page
  // So we redirect to API directly, it will render confirmation with pay button
  msgEl.innerHTML = "Token: " + token.substring(0,12) + "... Redirecting to verification server...";
  setTimeout(() => {
    window.location.href = API_URL + "?token=" + encodeURIComponent(token);
  }, 1200);
})();
</script>
</div>
</body>
</html>
